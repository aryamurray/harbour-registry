# Fixture: a tarball-pinned package whose URL is a template (what `watch.py bump` bumps).
[package]
name = "fx-tarball"
description = "Fixture: pinned by tarball sha256, URL from a template, upstream on GitHub"
license = "Zlib"
homepage = "https://fx-tarball.invalid"

