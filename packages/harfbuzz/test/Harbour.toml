# Consumer test for harfbuzz, through the registry (see ../../zlib/test/Harbour.toml).
# harfbuzz is C++ (one translation unit, `harfbuzz.cc`) with a C API, and this
# consumer is a plain C program on purpose: that is how most programs use it.
# It only links because Harbour chooses the C++ link driver when anything
# statically linked into a program is C++; with a C driver it fails on
# `__gxx_personality_v0`. So this test is also the registry's check on that.
[package]
name = "harfbuzz-test"
version = "0.1.0"

[dependencies]
harfbuzz = "*"

[targets.harfbuzz-test]
kind = "exe"
lang = "c"
sources = ["src/main.c"]
