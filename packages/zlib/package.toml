[package]
name = "zlib"
description = "General-purpose lossless compression library (deflate/inflate, gzip, crc32, adler32)"
license = "Zlib"
homepage = "https://zlib.net"

[upstream]
git = "https://github.com/madler/zlib"
tag = "v{version}"
url = "https://github.com/madler/zlib/releases/download/{tag}/zlib-{version}.tar.gz"
strip_prefix = "zlib-{version}"

[[release]]
version = "1.4.0"
upstream_version = "1.4"
sha256 = "02dd159783677a749c04adbdd02b55b8a2bcc7e054f51b76b549199a916ad584"
license_sha256 = "3cb8e028716cf70b75c9d3d0c5eb9d0711187c043448180e77834f4b062f0ee9"

[[release]]
version = "1.3.1"
sha256 = "9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23"
license_sha256 = "3cb8e028716cf70b75c9d3d0c5eb9d0711187c043448180e77834f4b062f0ee9"
republish = "1.3.1 build unchanged (same 15 translation units, flags and defines); the source list is now expressed as the pattern `*.c` instead of 15 file names"

[test]
platforms = ["linux", "macos", "windows"]
objects = 15
verify = true
