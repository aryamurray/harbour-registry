# Consumer test for openssl, through the registry (see ../../zlib/test/Harbour.toml).
[package]
name = "openssl-test"
version = "0.1.0"

[dependencies]
openssl = "*"

[targets.openssl-test]
kind = "exe"
sources = ["src/main.c"]

# The low-level SHA and AES APIs are deprecated in openssl 3.0 in favour of
# EVP, which this slice does not build. Suppressing the attribute keeps 17
# deprecation warnings out of the output, where they would bury a real diagnostic.
[targets.openssl-test.private]
defines = ["OPENSSL_SUPPRESS_DEPRECATED"]

[targets.openssl-test.deps]
openssl = { target = "crypto" }
