[package]
name = "libpng"
version = "1.6.50"
license = "libpng-2.0"

[dependencies]
zlib = "^1.3"

[targets.png]
kind = "staticlib"
lang = "c"
sources = [
    "png.c", "pngerror.c", "pngget.c", "pngmem.c", "pngpread.c", "pngread.c",
    "pngrio.c", "pngrtran.c", "pngrutil.c", "pngset.c", "pngtrans.c",
    "pngwio.c", "pngwrite.c", "pngwtran.c", "pngwutil.c",
]

[targets.png.surface.compile.public]
include_dirs = ["."]
defines = ["PNG_ARM_NEON_OPT=0", "PNG_INTEL_SSE_OPT=0", "PNG_MIPS_MSA_OPT=0", "PNG_POWERPC_VSX_OPT=0", "PNG_LOONGARCH_LSX_OPT=0"]

# png.c calls pow() and floor() (gamma tables, chromaticity maths), and a static
# archive does not record that, so a consumer that does not link libm fails with
# "undefined reference to `pow'" in a file it never wrote. Public for that reason.
# Written as a bare `m` for every OS on purpose: Harbour drops the Unix-only
# libraries (`m`, `dl`, `pthread`, `rt`) under MSVC, where the CRT carries the math,
# exactly as it does for cjson's `m`.
[targets.png.surface.link.public]
libs = ["m"]
