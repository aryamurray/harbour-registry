# Consumer test for libpng, through the registry (see ../../zlib/test/Harbour.toml).
# libpng depends on zlib, which Harbour fetches from the same registry: encoding
# a PNG exercises both, because libpng's IDAT chunks are deflate streams.
[package]
name = "libpng-test"
version = "0.1.0"

[dependencies]
libpng = "*"

[targets.libpng-test]
kind = "exe"
sources = ["src/main.c"]
