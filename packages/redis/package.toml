[package]
name = "redis"
description = "In-memory data structure store"
license = "BSD-3-Clause"
homepage = "https://redis.io"

[upstream]
git = "https://github.com/redis/redis"
tag = "{version}"
url = "https://download.redis.io/releases/redis-{version}.tar.gz"
strip_prefix = "redis-{version}"
# Patch releases only. Redis changed its license at 7.4 (BSD-3-Clause up to 7.2; RSALv2/SSPLv1
# from 7.4), and the gate cannot see a license: an automated bump would carry `license` forward
# unchanged. Moving past 7.2 is a human decision that includes updating `license`.
max_bump = "patch"

[[release]]
version = "7.2.16"
sha256 = "960a8ec15e34ff40e57ff16837b26b33bd81f2da6d24497bb63de532a323a18e"
license_sha256 = "ba667c15211a9d7f16d21db3d5aff053cff2fdedc8d9a5168c42c8af5a2aef57"

[test]
platforms = ["linux", "macos"]
objects = 145
