# The manifest Harbour builds the package with: what the patch adds to the upstream tree. It
# describes the NEWEST release in package.toml. Keep [package] version and license equal to it.
[package]
name = "example"
version = "1.0.0"
description = "One line saying what the library is"
license = "MIT"
homepage = "https://example.com/example"
# Platforms this manifest can build for. tools/lint.py requires every platform in package.toml
# [test] platforms to match one of these triples.
supports = ["*-apple-darwin", "*-*-linux-gnu", "*-*-linux-musl"]

# Dependencies on OTHER PACKAGES IN THIS REGISTRY, by version (no path, git or registry keys):
# [dependencies]
# zlib = "^1.3"

# Name every source: a source list that silently shrinks still links.
[targets.example]
kind = "staticlib"
sources = ["src/example.c"]
public_headers = ["include/example.h"]

[targets.example.public]
include_dirs = ["include"]
# system_libs = ["m"]   # libraries a static archive does not record but its consumers need
