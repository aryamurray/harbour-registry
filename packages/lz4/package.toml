[package]
name = "lz4"
description = "Extremely fast lossless compression: LZ4 blocks, high-compression mode and the frame format"
license = "BSD-2-Clause"
homepage = "https://lz4.org"

[upstream]
git = "https://github.com/lz4/lz4"
tag = "v{version}"
url = "https://github.com/lz4/lz4/releases/download/{tag}/lz4-{version}.tar.gz"
strip_prefix = "lz4-{version}"

[[release]]
version = "1.11.1"
sha256 = "683fed08a844ad012196381e40badf80c0bbe4962959761416d41c9e67d77ec7"
license_sha256 = "6048acb71bbd00cd6b6a05ed5bd46d359e02700485c4175a98cc71df865075b9"
republish = "public include dir exposed lib/xxhash.h, an XXH3-less copy that shadowed the xxhash package"

[test]
platforms = ["linux", "macos", "windows"]
objects = 5
verify = true
