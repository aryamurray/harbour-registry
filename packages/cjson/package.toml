[package]
name = "cjson"
description = "Ultralightweight JSON parser in ANSI C"
license = "MIT"
homepage = "https://github.com/DaveGamble/cJSON"

[upstream]
git = "https://github.com/DaveGamble/cJSON"
tag = "v{version}"
url = "https://github.com/DaveGamble/cJSON/archive/refs/tags/{tag}.tar.gz"
strip_prefix = "cJSON-{version}"

[[release]]
version = "1.7.18"
sha256 = "3aa806844a03442c00769b83e99970be70fbef03735ff898f4811dd03b9f5ee5"
republish = "1.7.18 gains Windows (MSVC) support: supports now lists *-pc-windows-msvc (Harbour skips the Unix-only libm there)"

[test]
platforms = ["linux", "macos", "windows"]
objects = 2
verify = true
