[package]
name = "libwebp"
description = "WebP image codec: encoder, decoder, sharp YUV conversion, demux and mux libraries"
license = "BSD-3-Clause"
homepage = "https://developers.google.com/speed/webp"

[upstream]
git = "https://github.com/webmproject/libwebp"
tag = "v{version}"
url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{version}.tar.gz"
strip_prefix = "libwebp-{version}"

[[release]]
version = "1.6.0"
sha256 = "e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564"
license_sha256 = "d62ec3b251e352e71e28b3c8e86bf7b7f0d95e6815962d1e08312a0745526c0b"

[test]
platforms = ["linux", "macos", "windows"]
objects = 102
verify = true
