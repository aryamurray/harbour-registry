[package]
name = "cpython"
description = "The Python interpreter, built from its generated sources"
license = "PSF-2.0"
homepage = "https://www.python.org"

[upstream]
git = "https://github.com/python/cpython"
tag = "v{version}"
url = "https://www.python.org/ftp/python/{version}/Python-{version}.tgz"
strip_prefix = "Python-{version}"

[[release]]
version = "3.15.2"
sha256 = "f74e1db0eabd651cd01e4e2a00201bd41866abe74869ab716f9bf33cbbaa0943"
license_sha256 = "0bb2311fa1ac8042ab6040e09864f794aaba5ea95ca941b2a00b07aa55238331"

[[release]]
version = "3.14.9"
sha256 = "8b47e85ee67e93945e93620a051a8f44bfc1e9735ed67075d166f4a74b7a060b"
license_sha256 = "0bb2311fa1ac8042ab6040e09864f794aaba5ea95ca941b2a00b07aa55238331"
republish = "3.14.9 build unchanged (same source files, flags, defines and generators); the regular core directories (Parser, Objects, Python, Modules/_io) are now expressed as patterns with a short exclude list instead of ~185 file names"

[test]
platforms = ["linux", "macos"]
objects = { default = 197, macos = 196 }

[review]
generators = true
