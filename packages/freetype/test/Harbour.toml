# Consumer test for freetype, through the registry (see ../../zlib/test/Harbour.toml).
# freetype depends on zlib and libpng, which Harbour fetches from the same registry.
[package]
name = "freetype-test"
version = "0.1.0"

[dependencies]
freetype = "*"

[targets.freetype-test]
kind = "exe"
sources = ["src/main.c"]

# libm, for the same reason as ../../libpng/test/Harbour.toml: freetype links
# libpng, whose published manifest does not put libm on its public link surface.
# A known defect of the published libpng entry, worked around here only; delete
# the table when libpng is republished with the fix.
[targets.freetype-test.private]
system_libs = ["m"]
