# Consumer test for freetype, through the registry (see ../../zlib/test/Harbour.toml).
# freetype depends on zlib and libpng, which Harbour fetches from the same registry.
[package]
name = "freetype-test"
version = "0.1.0"

[dependencies]
freetype = "*"

[targets.freetype-test]
kind = "exe"
sources = ["src/main.c"]
