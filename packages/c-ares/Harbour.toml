# CMake's SYSFLAGS for Linux, and HAVE_CONFIG_H=1 so that ares_setup.h includes the generated header.
[[targets.cares.when]]
os = "linux"
defines = ["HAVE_CONFIG_H=1", "_GNU_SOURCE", "_POSIX_C_SOURCE=200809L", "_XOPEN_SOURCE=700", "GETSERVBYPORT_R_ARGS=6", "GETSERVBYNAME_R_ARGS=6"]

# SYSFLAGS for Darwin; HAVE_GETADDRINFO_THREADSAFE is CMake's per-system answer for Darwin.
[[targets.cares.when]]
os = "macos"
defines = ["HAVE_CONFIG_H=1", "_DARWIN_C_SOURCE", "HAVE_GETADDRINFO_THREADSAFE=1"]

# Windows: no HAVE_CONFIG_H (config-win32.h is used); SYSFLAGS, plus the _WIN32_WINNT Makefile.msvc sets.
[[targets.cares.when]]
os = "windows"
defines = ["WIN32_LEAN_AND_MEAN", "_CRT_SECURE_NO_DEPRECATE", "_CRT_NONSTDC_NO_DEPRECATE", "_WIN32_WINNT=0x0602"]

[[targets.cares.surface.when]]
os = "linux"
[targets.cares.surface.when."link.public"]
libs = ["pthread"]

[[targets.cares.surface.when]]
os = "macos"
[targets.cares.surface.when."link.public"]
libs = ["pthread"]

[[targets.cares.surface.when]]
os = "windows"
[targets.cares.surface.when."link.public"]
libs = ["ws2_32", "advapi32", "iphlpapi"]
