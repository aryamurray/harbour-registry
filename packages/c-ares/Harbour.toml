# c-ares 1.34.9, built the way upstream's own non-autotools builds do, with its configuration
# written by Harbour (probes) instead of by CMake or configure.
#
# Source list: `CSOURCES` of src/lib/Makefile.inc, verbatim (what CMake's transform_makefile_inc
# feeds to add_library). Every platform's files are in it (ares_sysconfig_win.c, ares_event_win32.c,
# ares_event_epoll.c, ares_event_kqueue.c, ares_sysconfig_mac.c, windows_port.c...): they guard
# themselves with the HAVE_*/_WIN32 macros, so none is selected per OS here.
#
# Configuration, Unix (linux, macos). Upstream's CMake compiles with HAVE_CONFIG_H=1 and a generated
# ares_config.h (src/lib/ares_config.h.cmake). Here the probes below write that file; each name is a
# `#cmakedefine` of that template that the library reads, answered as CMakeLists.txt answers it:
# CHECK_INCLUDE_FILES (header probes; net/if.h and netinet/tcp.h with the prelude CMake gives them),
# CHECK_SYMBOL_EXISTS (symbol probes for functions, constant probes for macros), CARES_TYPE_EXISTS
# (type probes). Choices CMake makes without measuring are literals: the CARES_THREADS option (ON),
# CARES_RANDOM_FILE (/dev/urandom), and the send/recv/getnameinfo argument types, which CMake sets
# from HAVE_SSIZE_T and HAVE_SOCKLEN_T (both exist on every Unix claimed here).
# Two names are CMake's conjunctions of two answers, probed as the one that varies:
# HAVE_FCNTL_O_NONBLOCK (fcntl exists, which POSIX guarantees, and O_NONBLOCK) and
# HAVE_IOCTL_FIONBIO (ioctl exists and FIONBIO). HAVE_SETSOCKOPT_SO_NONBLOCK is SO_NONBLOCK alone
# likewise. HAVE_GETSERVBY*_R is probed; its ARGS value is CMake's "probably linux" 6, on Linux only.
# CMake's SYSFLAGS become the per-OS defines below (they reach the probes as well).
#
# ares_build.h is not generated: include/ares_build.h ships in the tarball with the "non-configure"
# answers (socklen_t and ssize_t under __GNUC__, the Windows headers under _WIN32), which are the
# answers CMake's ares_build.h.cmake gives on these platforms, and ares.h includes it by quote from
# its own directory, so a generated copy could never win. Likewise ares_version.h is upstream's.
#
# Windows (MSVC): upstream's Makefile.msvc builds with no generated header: HAVE_CONFIG_H is
# not defined, ares_setup.h includes the hand-written src/lib/config-win32.h, and the compile line is
# `/DCARES_BUILDING_LIBRARY /DCARES_STATICLIB /D_WIN32_WINNT=0x0602` with ws2_32, advapi32,
# iphlpapi, kernel32 (CMake's CARES_DEPENDENT_LIBS for WIN32 is ws2_32 advapi32 iphlpapi and its
# SYSFLAGS add WIN32_LEAN_AND_MEAN and the two _CRT_*_DEPRECATE). Probes still run there (the
# Unix header names simply answer no) and their header is never included.
#
# Libraries: static builds need CARES_STATICLIB on the public surface (upstream adds it for WIN32;
# elsewhere it is inert). CARES_THREADS is ON upstream, so Unix links the thread library
# (CMake's Threads::Threads, public on the static target). Not linked: resolv (CMake adds it only if
# res_servicename is in libresolv and not already in libc, which it is on macOS and glibc),
# nsl/socket/network (Solaris, Haiku), rt (clock_gettime is in libc).
[package]
name = "c-ares"
version = "1.34.9"
description = "Asynchronous DNS resolver library, configured by Harbour probes"
license = "MIT"
homepage = "https://c-ares.org"
requires = "hosted"
supports = ["*-apple-darwin", "*-*-linux-gnu", "*-*-linux-musl", "*-pc-windows-msvc"]

