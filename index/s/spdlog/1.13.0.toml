# spdlog - Fast C++ logging library
# https://github.com/gabime/spdlog

[package]
name = "spdlog"
version = "1.13.0"

[source.git]
url = "https://github.com/gabime/spdlog"
rev = "7c02e204c92545f869e2f04edaab1f19fe8b19fd"

[metadata]
tier = 0
category = "logging"
license = "MIT"
upstream_url = "https://github.com/gabime/spdlog"
min_platforms = 3

[metadata.platforms]
linux = true
macos = true
windows = true
freebsd = true
android = true

[metadata.harness]
header = "spdlog/spdlog.h"
test_call = "spdlog::info(\"test\")"
lang = "cxx"

[features]
default = ["static", "fmt-bundled"]

[features.available.static]
description = "Build static library"

[features.available.shared]
description = "Build shared library"

[features.available.header-only]
description = "Use as header-only library"

[features.available.fmt-bundled]
description = "Use bundled fmt library"

[features.available.fmt-external]
description = "Use external fmt library"

[surface_override.compile.public]
include_dirs = ["include"]
