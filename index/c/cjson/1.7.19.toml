[package]
name = "cjson"
version = "1.7.19"

[source.git]
url = "https://github.com/DaveGamble/cJSON"
rev = "c859b25da02955fef659d658b8f324b5cde87be3"

[metadata]
tier = 1
category = "serialization"
license = "MIT"
upstream_url = "https://github.com/DaveGamble/cJSON"
min_platforms = 3

[metadata.platforms]
linux = true
macos = true
windows = true
freebsd = true

[metadata.harness]
header = "cJSON.h"
test_call = "cJSON_Version()"
lang = "c"

[features]
default = ["static"]

[features.available.static]
description = "Build static library"

[features.available.shared]
description = "Build shared library"

# cJSON is just two files: cJSON.c and cJSON.h
[surface_override]
sources = ["cJSON.c"]

[surface_override.compile.public]
include_dirs = ["."]
defines = []
