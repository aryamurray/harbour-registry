# fmt - A modern formatting library
# https://github.com/fmtlib/fmt

[package]
name = "fmt"
version = "10.2.1"

[source.git]
url = "https://github.com/fmtlib/fmt"
rev = "e69e5f977d458f2650bb346dadf2ad30c5320281"

[metadata]
tier = 0
category = "formatting"
license = "MIT"
upstream_url = "https://github.com/fmtlib/fmt"
min_platforms = 3

[metadata.platforms]
linux = true
macos = true
windows = true
freebsd = true
android = true
ios = true

[metadata.harness]
header = "fmt/core.h"
test_call = "fmt::format(\"test\")"
lang = "cxx"

[features]
default = ["static"]

[features.available.static]
description = "Build static library"

[features.available.shared]
description = "Build shared library"

[features.available.header-only]
description = "Use as header-only library (define FMT_HEADER_ONLY)"

[surface_override.compile.public]
include_dirs = ["include"]
