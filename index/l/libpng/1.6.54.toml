[package]
name = "libpng"
version = "1.6.54"

[source.git]
url = "https://github.com/pnggroup/libpng"
rev = "02f2b4f4699f0ef9111a6534f093b53732df4452"

[metadata]
tier = 0
category = "image"
license = "libpng-2.0"
upstream_url = "https://github.com/pnggroup/libpng"
min_platforms = 3

[metadata.platforms]
linux = true
macos = true
windows = true
freebsd = true

[metadata.harness]
header = "png.h"
test_call = "png_access_version_number()"
lang = "c"

[features]
default = ["static"]

[features.available.static]
description = "Build static library"

[features.available.shared]
description = "Build shared library"

[dependencies]
zlib = "1.3.1"

[surface_override]
sources = [
    "png.c",
    "pngerror.c",
    "pngget.c",
    "pngmem.c",
    "pngpread.c",
    "pngread.c",
    "pngrio.c",
    "pngrtran.c",
    "pngrutil.c",
    "pngset.c",
    "pngtrans.c",
    "pngwio.c",
    "pngwrite.c",
    "pngwtran.c",
    "pngwutil.c",
]

[surface_override.compile.public]
include_dirs = ["."]
defines = []
