# Harbour Registry CI - Shim Validation
#
# This workflow validates shims by:
# 1. Detecting which shims changed in the PR
# 2. Generating a build matrix from declared platforms (NOT a fixed matrix)
# 3. Building and verifying on each declared platform
#
# If a shim declares `windows = true` but doesn't build on Windows, the PR fails.

name: Validate Shim

on:
  pull_request:
    paths:
      - 'index/**/*.toml'
      - 'index/**/patches/**'
  push:
    branches: [main]
    paths:
      - 'index/**/*.toml'
      - 'index/**/patches/**'
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to validate (empty = all changed)'
        required: false
        type: string

jobs:
  # Stage 1: Detect changes, validate TOML, generate platform matrix
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need history for diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect changed shims
        id: detect
        env:
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python .github/scripts/detect-changed-shims.py

      - name: Validate TOML syntax and policy
        if: steps.detect.outputs.has_changes == 'true'
        env:
          CHANGED_SHIMS: ${{ steps.detect.outputs.changed_shims }}
        run: python .github/scripts/validate-toml.py

      - name: Generate platform matrix from shim declarations
        id: matrix
        if: steps.detect.outputs.has_changes == 'true'
        env:
          CHANGED_SHIMS: ${{ steps.detect.outputs.changed_shims }}
        run: python .github/scripts/generate-matrix.py

  # Stage 2: Build on each DECLARED platform (not a fixed matrix)
  build:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true' && fromJson(needs.prepare.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.package }}@${{ matrix.version }} / ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          shared-key: harbour-${{ runner.os }}

      - name: Get Harbour latest commit
        id: harbour-commit
        run: echo "sha=$(git ls-remote https://github.com/aryamurray/harbour refs/heads/main | cut -f1)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache Harbour binary
        id: cache-harbour
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/harbour
            ~/.cargo/bin/harbour.exe
          key: harbour-bin-${{ runner.os }}-${{ steps.harbour-commit.outputs.sha }}

      # Install harbour BEFORE setting up cross-compile toolchain
      # to avoid cross-compile flags polluting the harbour build
      - name: Install Harbour CLI (Unix)
        if: runner.os != 'Windows' && steps.cache-harbour.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/aryamurray/harbour --bin harbour
        shell: bash

      - name: Install Harbour CLI (Windows)
        if: runner.os == 'Windows' && steps.cache-harbour.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/aryamurray/harbour --bin harbour
        shell: cmd

      - name: Verify Harbour installed
        run: harbour --version
        shell: bash

      # Setup platform toolchain AFTER harbour is installed
      # This sets CC/CFLAGS for cross-compilation targets
      - name: Setup platform toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          platform: ${{ matrix.platform }}

      - name: Verify package build (Unix)
        if: runner.os != 'Windows'
        id: verify-unix
        run: |
          harbour verify ${{ matrix.package }} \
            --version ${{ matrix.version }} \
            --output-format github \
            ${{ matrix.target_triple && format('--target-triple {0}', matrix.target_triple) || '' }} \
            ${{ matrix.skip_harness && '--skip-harness' || '' }} \
            --registry-path .
        shell: bash
        env:
          HARBOUR_TARGET_TRIPLE: ${{ matrix.target_triple }}

      - name: Verify package build (Windows)
        if: runner.os == 'Windows'
        id: verify-windows
        run: |
          harbour verify ${{ matrix.package }} --version ${{ matrix.version }} --output-format github ${{ matrix.skip_harness && '--skip-harness' || '' }} --registry-path .
        shell: cmd
        env:
          HARBOUR_TARGET_TRIPLE: ${{ matrix.target_triple }}

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.package }}-${{ matrix.version }}-${{ matrix.platform }}
          path: |
            .harbour/target/**/*.log
            .harbour/target/**/build.log
            .harbour/target/**/error.log
          retention-days: 7

  # Stage 3: Aggregate results and report
  report:
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check build results
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "All platform builds passed!"
            exit 0
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            echo "Build was skipped (no matrix entries generated)"
            exit 0
          else
            echo "::error::Platform builds failed - shim must build on all declared platforms"
            echo ""
            echo "If a shim declares a platform (e.g., 'windows = true'), it MUST build on that platform."
            echo "Either fix the build or remove the platform declaration."
            exit 1
          fi

      - name: Generate summary
        if: always()
        run: |
          echo "## Shim Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "All declared platform builds passed." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            echo "No builds were required." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some platform builds failed. Check the job logs for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Requirement:** Shims must build successfully on all platforms they declare." >> $GITHUB_STEP_SUMMARY
          fi

  # Generate packages.json index on main branch
  generate-index:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate packages.json
        run: |
          python3 << 'EOF'
          import json
          import os

          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          from pathlib import Path

          packages = []
          index_dir = Path("index")

          for letter_dir in sorted(index_dir.iterdir()):
              if not letter_dir.is_dir():
                  continue
              for pkg_dir in sorted(letter_dir.iterdir()):
                  if not pkg_dir.is_dir():
                      continue
                  versions = []
                  for toml_file in pkg_dir.glob("*.toml"):
                      try:
                          with open(toml_file, "rb") as f:
                              data = tomllib.load(f)
                          metadata = data.get("metadata", {})
                          platforms = metadata.get("platforms", {})
                          enabled_platforms = [p for p, v in platforms.items() if v]

                          versions.append({
                              "version": data["package"]["version"],
                              "tier": metadata.get("tier"),
                              "category": metadata.get("category"),
                              "platforms": enabled_platforms,
                          })
                      except Exception as e:
                          print(f"Warning: Failed to parse {toml_file}: {e}")

                  if versions:
                      packages.append({
                          "name": pkg_dir.name,
                          "versions": sorted(versions, key=lambda v: v["version"], reverse=True),
                      })

          packages.sort(key=lambda p: p["name"])

          with open("packages.json", "w") as f:
              json.dump({"packages": packages}, f, indent=2)

          print(f"Generated index with {len(packages)} packages")
          EOF

      - name: Commit packages.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add packages.json
          git diff --staged --quiet || git commit -m "chore: update packages.json index"
          git push
