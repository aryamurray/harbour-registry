name: 'Setup Toolchain'
description: 'Setup platform-specific build toolchain for Harbour verification'

inputs:
  platform:
    description: 'Target platform (linux, macos, windows, freebsd, android, ios)'
    required: true

runs:
  using: composite
  steps:
    # Linux native
    - name: Setup Linux toolchain
      if: inputs.platform == 'linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config

    # macOS native
    - name: Setup macOS toolchain
      if: inputs.platform == 'macos'
      shell: bash
      run: |
        echo "Using Xcode toolchain:"
        xcode-select --print-path
        # Ensure cmake is available
        brew install cmake || true

    # Windows native (MSVC)
    - name: Setup Windows toolchain
      if: inputs.platform == 'windows'
      uses: ilammy/msvc-dev-cmd@v1

    # FreeBSD cross-compilation
    - name: Setup FreeBSD cross-compile toolchain
      if: inputs.platform == 'freebsd'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld cmake

        # Create wrapper scripts for FreeBSD cross-compilation
        echo "Setting up FreeBSD cross-compilation environment..."

        # Set environment variables for cross-compilation
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CFLAGS=--target=x86_64-unknown-freebsd14 -fuse-ld=lld" >> $GITHUB_ENV
        echo "CXXFLAGS=--target=x86_64-unknown-freebsd14 -fuse-ld=lld" >> $GITHUB_ENV
        echo "LDFLAGS=--target=x86_64-unknown-freebsd14 -fuse-ld=lld" >> $GITHUB_ENV
        echo "HARBOUR_TARGET_TRIPLE=x86_64-unknown-freebsd" >> $GITHUB_ENV

    # Android NDK
    - name: Setup Android NDK toolchain
      if: inputs.platform == 'android'
      shell: bash
      run: |
        # ANDROID_NDK_LATEST_HOME is set by GitHub Actions
        NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"

        if [ -z "$NDK_ROOT" ]; then
          echo "::error::Android NDK not found"
          exit 1
        fi

        echo "Using Android NDK at: $NDK_ROOT"

        # Set toolchain paths
        TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
        echo "CC=$TOOLCHAIN/bin/aarch64-linux-android21-clang" >> $GITHUB_ENV
        echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android21-clang++" >> $GITHUB_ENV
        echo "AR=$TOOLCHAIN/bin/llvm-ar" >> $GITHUB_ENV
        echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> $GITHUB_ENV
        echo "HARBOUR_TARGET_TRIPLE=aarch64-linux-android" >> $GITHUB_ENV

    # iOS SDK (cross-compile from macOS)
    - name: Setup iOS SDK toolchain
      if: inputs.platform == 'ios'
      shell: bash
      run: |
        # Get iOS SDK path
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Using iOS SDK at: $SDK"

        # Set environment for iOS cross-compilation
        echo "SDKROOT=$SDK" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CXX=clang++" >> $GITHUB_ENV
        echo "CFLAGS=-isysroot $SDK -target arm64-apple-ios12.0" >> $GITHUB_ENV
        echo "CXXFLAGS=-isysroot $SDK -target arm64-apple-ios12.0" >> $GITHUB_ENV
        echo "LDFLAGS=-isysroot $SDK -target arm64-apple-ios12.0" >> $GITHUB_ENV
        echo "HARBOUR_TARGET_TRIPLE=aarch64-apple-ios" >> $GITHUB_ENV
