# Template: Native C/C++ library (no build system)
# Use this for simple libraries that can be compiled directly

[package]
name = "PACKAGE_NAME"
version = "VERSION"

[source.git]
url = "https://github.com/ORG/REPO"
rev = "FULL_40_CHAR_COMMIT_SHA"

[metadata]
tier = 0
category = "CATEGORY"
license = "SPDX_LICENSE_ID"
upstream_url = "https://github.com/ORG/REPO"
min_platforms = 3

[metadata.platforms]
linux = true
macos = true
windows = true

[metadata.harness]
header = "package.h"
test_call = "package_init()"
lang = "c"

[features]
default = ["static"]

[features.available.static]
description = "Build static library"

[features.available.shared]
description = "Build shared library"

# Surface override is typically required for native libraries
[surface_override.compile.public]
include_dirs = ["include", "."]
defines = []

# If system dependencies are needed
# [[surface_override.link.public.libs]]
# kind = "system"
# name = "pthread"
